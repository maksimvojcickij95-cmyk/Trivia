<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#211d3b">
  <title>Вікторина</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="quiz">
    <header class="header">
      <div class="eyebrow">ІНТЕРАКТИВНА ВІКТОРИНА</div>
      <h1>Перевір свої знання</h1>
      <p>Обери правильну картинку!</p>
    </header>

    <div class="info">
      <span id="number">Раунд 1 із 29</span>
      <span id="score">⭐ 0 балів</span>
    </div>

    <div class="progress" aria-label="Прогрес вікторини">
      <div id="progress-bar"></div>
    </div>

    <section id="game">
      <h2 id="question"></h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" aria-live="polite"></p>
      <button id="next" class="primary-button" type="button" hidden>Наступне запитання ➜</button>
    </section>

    <section id="result" hidden>
      <div class="trophy">🏆</div>
      <h2>Квіз завершено!</h2>
      <p id="final-score" class="final-score"></p>
      <p id="message"></p>
      <button id="restart" class="primary-button" type="button">🔄 Грати знову</button>
    </section>
    <footer>Навчайся та грай </footer>
  </main>
</body>
</html>
